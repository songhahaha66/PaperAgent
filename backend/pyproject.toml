[project]
name = "backend"
version = "0.1.0"
description = "PaperAgent Backend API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "httpx2>=2.16.0",
    "python-jose[cryptography]>=3.5.0",
    "bcrypt>=5.0.0",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.6",
    "psycopg[binary]>=3.3.8",
    "aiosqlite>=0.22.1",
    "python-dotenv>=1.2.4",
    "pydantic[email]>=2.14.3",
    "pytest>=9.2.0",
    "numpy>=2.5.4",
    "matplotlib>=3.11.2",
    "scipy>=1.18.1",
    "pandas>=3.1.0",
    "seaborn>=0.13.2",
    "alembic>=1.20.1",
    "python-docx>=1.2.0",
    "Pillow>=12.3.0",
    "pdfplumber>=0.11.10",
    "openpyxl>=3.1.5",
    "langchain>=1.4.7",
    "langchain-openai>=1.7.3",
    "langchain-anthropic>=1.7.7",
    "langchain-google-genai>=4.4.2",
    "webauthn>=3.0.1",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "scikit-learn>=1.9.1",
    "defusedxml>=0.7.1",
    "langsmith>=0.8.18",
    "pypdfium2>=5.14.0",
]

[project.optional-dependencies]
sandbox = [
    "opensandbox-code-interpreter==1.1.1",
    "opensandbox==1.2.0",
]

[tool.uv.workspace]
members = []

[dependency-groups]
dev = ["pytest-timeout>=2.4.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
required_plugins = ["pytest-timeout>=2.4.0"]
timeout = 60
# Terminate even if an async task swallows cancellation or teardown blocks.
timeout_method = "thread"
