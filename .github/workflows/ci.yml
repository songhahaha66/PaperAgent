name: CI

on:
  pull_request:
    branches: [ dev, master ]
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # 测试只用临时 SQLite，不连生产库；密钥只给 JWT 测试用
      DATABASE_URL: sqlite:///./ci.db
      SECRET_KEY: ci-only-secret
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install pandoc and CJK fonts
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc fonts-noto-cjk

    - name: Install uv
      run: pipx install uv

    - name: Install dependencies
      run: uv sync

    - name: Run tests
      run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Type check and build
      run: npm run build
