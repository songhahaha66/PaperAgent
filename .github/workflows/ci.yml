name: CI

on:
  pull_request:
    branches: [ dev, master ]
  push:
    branches: [ dev ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      # 测试只用临时 SQLite，不连生产库；密钥只给 JWT 测试用
      DATABASE_URL: sqlite:///./ci.db
      SECRET_KEY: ci-only-secret
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install pandoc and CJK fonts
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc fonts-noto-cjk

    - name: Install uv
      run: pipx install uv

    - name: Install dependencies
      run: uv sync --locked --extra sandbox

    - name: Run tests
      timeout-minutes: 10
      run: uv run --locked --extra sandbox pytest -vv --tb=short --durations=10

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Type check and build
      run: npm run build

    - name: Workspace regressions
      run: npm run test:workspace
