version: 2
updates:
  # Backend Python (uv). Dependabot cannot mix version and security updates
  # in one group, so each class is batched into a single PR.
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "chore(deps)"
    groups:
      backend-python:
        applies-to: version-updates
        patterns:
          - "*"
      backend-python-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Frontend npm. One weekly version PR and one batched security PR
  # instead of one PR per package (or a major/minor split).
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend-npm:
        applies-to: version-updates
        patterns:
          - "*"
      frontend-npm-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: "vue"
        update-types: ["version-update:semver-major"]

  # Docker dependencies
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-all:
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-all:
        patterns:
          - "*"
