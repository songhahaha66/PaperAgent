extensions:
  - addsTo:
      pack: codeql/python-all
      extensible: barrierModel
    data:
      # relative_parts rejects absolute paths, empty/dot/dot-dot components,
      # Windows drive prefixes, backslashes and NULs before returning segments.
      # Only the returned components are safe for path injection. In particular
      # safe_join(root, ...) does NOT sanitize an attacker-controlled root.
      # Keep in sync with tests/test_security_regressions.py and workspace_layout.
      - ['services', 'Member[file_services].Member[workspace_layout].Member[relative_parts].ReturnValue.ListElement', 'path-injection']
